name: BoringCache Nx proof

on:
  pull_request:
    branches:
      - main
    paths:
      - .boringcache.toml
      - .github/workflows/boringcache-cache-proof.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  nx:
    name: Build application with Nx cache
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22.22.1
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.22.1
          package-manager-cache: false

      - name: Configure Nx cache
        uses: boringcache/one@6b7033721b37075b2138fd0c769bf088e0836ce6 # v1.14.0
        with:
          cli-version: v1.14.0
          setup: none
          mode: nx
          trust-policy: auto
          diagnostics: summary
          fail-on-cache-error: 'true'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:production
